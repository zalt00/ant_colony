[package]
name = "ant_colony"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "*"
rand_xoshiro = "*"
rustworkx-core = "*"
petgraph = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
bincode = "*"
glob = "*"
pyo3 = { version = "0.25.1" }



[profile.release]
debug = false
overflow-checks = false

[features]

extension-module = ["pyo3/extension-module"]
default = ["mean_path_heuristic"]

use_heuristic = []
need_ebc = []
need_tarjan = []
ebc_stretch_heuristic = ["use_heuristic", "need_ebc", "need_tarjan"]
stretch_heuristic = ["use_heuristic", "need_tarjan"]
mean_path_heuristic = ["use_heuristic"]
verbose = []
enable_counters = []

large_graph = []

louvain = []

usual = ["mean_path_heuristic", "large_graph"]

[lib]
name = "mylib"
path = "src/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "mybin"
path = "src/main.rs"


